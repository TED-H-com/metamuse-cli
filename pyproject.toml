[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metamuse-cli"
version = "0.1.0a2"
description = "Turn comments and transcripts into checkable drafts with source citations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
dependencies = [
    "curl-cffi==0.16.3",
    "mcp==2.3.0",
    "noiseprotocol==0.3.1",
    "platformdirs>=4.13.0",
    "pydantic>=2,<3",
    "tomlkit>=0.13,<1",
]

[project.urls]
Homepage = "https://ted-h-com.github.io/metamuse-cli/"
Repository = "https://github.com/TED-H-com/metamuse-cli"
Documentation = "https://github.com/TED-H-com/metamuse-cli/blob/main/docs/GETTING_STARTED.md"
Issues = "https://github.com/TED-H-com/metamuse-cli/issues"

[project.scripts]
metamuse = "metamuse.cli:main"

[project.optional-dependencies]
remote = ["yt-dlp==2026.8.19"]
facebook = [
    "playwright==1.63.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metamuse"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "playwright==1.63.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "yt-dlp==2026.8.19",
]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "metamuse/data/THIRD_PARTY_NOTICES.md"
"skills/metamuse" = "metamuse/data/skills/metamuse"
