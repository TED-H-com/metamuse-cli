[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metamuse-cli"
version = "0.1.0.dev0"
description = "Local-first MetaMuse application core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi==0.16.3",
    "mcp==2.3.0",
    "noiseprotocol==0.3.1",
    "platformdirs>=4.13.0",
    "pydantic>=2,<3",
]

[project.scripts]
metamuse = "metamuse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metamuse"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "metamuse/data/THIRD_PARTY_NOTICES.md"
